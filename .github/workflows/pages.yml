name: Pages

# Publishes the static demo (docs/, plus the pages the project already served)
# to GitHub Pages. Runs on pushes to master only; a pull request never deploys.
#
# Needs no database, no secrets and no model key: the demo is committed JSON
# (docs/data), regenerated by hand with scripts/export_public_snapshot.py.
# The full suite, with Postgres, runs in ci.yml; this workflow runs only the
# public-demo tests (secret scan, schemas, links, GET-only API) because those
# are what decide whether the site is safe to publish.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege for the test and build jobs; the deploy job adds what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: public demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the site, snapshot and API
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_public_site.py

  build:
    name: stage the site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: Stage docs/ and the existing pages
        run: python scripts/build_site.py _site

      - uses: actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
